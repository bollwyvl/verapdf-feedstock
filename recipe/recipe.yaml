# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.31.190"
  openjdk_min: "11"

package:
  name: verapdf
  version: ${{ version }}

source:
  url: https://github.com/veraPDF/veraPDF-apps/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 323edfd7860d96996a8883193a1740a8ae009f3298a94d2280137f33d6ec6be3

build:
  number: 0
  script:
    file: build-verapdf.py

requirements:
  build:
    - maven
    - python >=3.11
    - openjdk ${{ openjdk_min }}.*
  run:
    - openjdk >=${{ openjdk_min }}

tests:
  - package_contents:
      strict: true
      bin:
        - verapdf
        - verapdf-gui
      files:
        - ${{ "share" if unix else "Library" }}/verapdf/**
  - requirements:
      run:
        - pytest
        - openjdk ${{ openjdk_min }}.*
    script:
      file: run_test.py
  - requirements:
      run:
        - pytest
        - openjdk !=${{ openjdk_min }}
    script:
      file: run_test.py

about:
  license: GPL-3.0-or-later OR MPL-2.0
  license_file:
    - LICENSE.GPL
    - LICENSE.MPL
    - third-party-licenses/**
  summary: Command line and GUI industry supported PDF/A and PDF/UA Validation
  homepage: https://github.com/veraPDF/veraPDF-apps
  documentation: https://docs.verapdf.org

extra:
  recipe-maintainers:
    - bollwyvl
